[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpcli"
version = "0.1.0"
description = "A command-line interface for Model Context Protocol servers"
requires-python = ">=3.11"
readme = "README.md"
authors = []
keywords = ["llm", "mcp", "cli", "model-context-protocol"]
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mcpcli = "mcpcli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcpcli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
